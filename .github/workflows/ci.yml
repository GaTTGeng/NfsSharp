name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  CONFIGURATION: Release

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore NfsSharp.sln

      - name: Build
        run: dotnet build NfsSharp.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: >
          dotnet test NfsSharp.sln
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --no-restore
          --logger trx
          --results-directory TestResults

      - name: Pack
        run: >
          dotnet pack NfsSharp.sln
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --no-restore
          --output artifacts/packages
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}
          -p:RepositoryBranch=${{ github.ref_name }}
          -p:RepositoryCommit=${{ github.sha }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  kerberos-integration:
    name: Kerberos integration (NFS-Ganesha)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Build integration tests
        run: dotnet build tests/NfsSharp.Tests/NfsSharp.Tests.csproj --configuration Release
      - name: Run Kerberos integration tests
        env:
          NFSSHARP_KERBEROS_RESULTS_DIR: ${{ github.workspace }}/TestResults/KerberosIntegration
        run: bash tests/integration/kerberos/run.sh
      - name: Upload Kerberos integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kerberos-integration-results
          path: TestResults/KerberosIntegration
          if-no-files-found: error

  kerberos-kernel-integration:
    name: Kerberos integration (Linux kernel)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Start Linux kernel NFSv3 Kerberos server
        run: sudo bash tests/integration/kernel-nfs-kerberos/setup.sh

      - name: Run Kerberos integration tests
        env:
          KRB5_CONFIG: /run/nfssharp-kernel-kerberos/krb5.conf
          KRB5CCNAME: FILE:/run/nfssharp-kernel-kerberos/client/krb5cc_active
          NFSSHARP_RUN_KERBEROS_INTEGRATION: "1"
          NFSSHARP_KERBEROS_SERVER: 127.0.0.1
          NFSSHARP_KERBEROS_SPN: nfs/nfs.test.local@TEST.LOCAL
          NFSSHARP_KERBEROS_REALM: TEST.LOCAL
          NFSSHARP_KERBEROS_EXPORT: /srv/nfssharp-kernel-kerberos/export
          NFSSHARP_KERBEROS_READONLY_EXPORT: /srv/nfssharp-kernel-kerberos/readonly
          NFSSHARP_KERBEROS_PRIVATE_EXPORT: /srv/nfssharp-kernel-kerberos/private
          NFSSHARP_KERBEROS_ALICE_UID: "2001"
          NFSSHARP_KERBEROS_CLIENT_KEYTAB: /run/nfssharp-kernel-kerberos/client/client.keytab
          NFSSHARP_KERBEROS_ALICE_CCACHE: /run/nfssharp-kernel-kerberos/client/krb5cc_alice
          NFSSHARP_KERBEROS_BOB_CCACHE: /run/nfssharp-kernel-kerberos/client/krb5cc_bob
          NFSSHARP_KERBEROS_ACTIVE_CCACHE: /run/nfssharp-kernel-kerberos/client/krb5cc_active
          NFSSHARP_KERBEROS_SERVER_KEYTAB: /run/nfssharp-kernel-kerberos/krb5.keytab
          NFSSHARP_KERBEROS_REKEY_CMD: ${{ github.workspace }}/tests/integration/kernel-nfs-kerberos/rekey.sh
          NFSSHARP_KERBEROS_RESTART_CMD: ${{ github.workspace }}/tests/integration/kernel-nfs-kerberos/restart.sh
          NFSSHARP_KERBEROS_EXPECTED_WEAK_SERVICE_OUTCOME: nfs-access
        run: >
          dotnet test tests/NfsSharp.Tests/NfsSharp.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --filter "Category=KerberosIntegration"
          --logger trx
          --results-directory TestResults/KerberosKernelIntegration

      - name: Capture Linux kernel Kerberos evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p TestResults/KerberosKernelIntegration
          {
            uname -a
            cat /etc/os-release
            dpkg-query --show --showformat='${Package} ${Version}\n' nfs-kernel-server nfs-common rpcbind gssproxy krb5-kdc krb5-admin-server krb5-user libgssapi-krb5-2
          } > TestResults/KerberosKernelIntegration/server-version.txt 2>&1
          sudo rpcinfo -p 127.0.0.1 > TestResults/KerberosKernelIntegration/rpcinfo.txt 2>&1
          sudo showmount -e 127.0.0.1 > TestResults/KerberosKernelIntegration/exports.txt 2>&1
          sudo exportfs -v > TestResults/KerberosKernelIntegration/exportfs.txt 2>&1
          sudo cat /proc/fs/nfsd/versions > TestResults/KerberosKernelIntegration/nfs-versions.txt 2>&1
          sudo cat /proc/net/rpc/gss_krb5_enctypes > TestResults/KerberosKernelIntegration/gss-enctypes.txt 2>&1
          sudo cat /proc/net/rpc/use-gss-proxy > TestResults/KerberosKernelIntegration/use-gss-proxy.txt 2>&1
          sudo journalctl --no-pager -u gssproxy.service -u rpcbind.service -u nfs-server.service > TestResults/KerberosKernelIntegration/nfs-server.log 2>&1

      - name: Upload Linux kernel Kerberos results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kerberos-kernel-integration-results
          path: TestResults/KerberosKernelIntegration
          if-no-files-found: error

      - name: Stop Linux kernel NFSv3 Kerberos server
        if: always()
        run: sudo bash tests/integration/kernel-nfs-kerberos/teardown.sh

  nfs-v3-ganesha-integration:
    name: NFSv3 integration (NFS-Ganesha)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Start NFSv3 test server
        run: docker compose -f compose.integration.yml up --build --detach --wait --wait-timeout 90

      - name: Run NFSv3 integration tests
        env:
          NFSSHARP_RUN_NFSV3_INTEGRATION: "1"
          NFSSHARP_NFS_SERVER: 127.0.0.1
          NFSSHARP_NFS_EXPORT: /export
          NFSSHARP_NFS_EXPECTED_REPLACEMENT_RENAME_OUTCOME: io-preserves-both
          NFSSHARP_NFS_UID: "0"
          NFSSHARP_NFS_GID: "0"
        run: >
          dotnet test tests/NfsSharp.Tests/NfsSharp.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --filter "Category=Integration"
          --logger trx
          --results-directory TestResults/NfsV3Integration

      - name: Run NFSv3 server-restart recovery test
        env:
          NFSSHARP_RUN_NFSV3_INTEGRATION: "1"
          NFSSHARP_RUN_NFS_SERVER_RESTART_TEST: "1"
          NFSSHARP_NFS_RESTART_KIND: ganesha-compose
          NFSSHARP_NFS_SERVER: 127.0.0.1
          NFSSHARP_NFS_EXPORT: /export
          NFSSHARP_NFS_UID: "0"
          NFSSHARP_NFS_GID: "0"
        run: >
          dotnet test tests/NfsSharp.Tests/NfsSharp.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --no-restore
          --filter "Category=IntegrationRestart"
          --logger trx
          --results-directory TestResults/NfsV3Integration

      - name: Capture NFSv3 server logs
        if: always()
        run: |
          mkdir -p TestResults/NfsV3Integration
          docker compose -f compose.integration.yml ps --all > TestResults/NfsV3Integration/compose-ps.txt
          docker compose -f compose.integration.yml logs --no-color > TestResults/NfsV3Integration/nfs-server.log

      - name: Upload NFSv3 integration results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nfs-v3-integration-results
          path: TestResults/NfsV3Integration
          if-no-files-found: error

      - name: Stop NFSv3 test server
        if: always()
        run: docker compose -f compose.integration.yml down --volumes --remove-orphans

  nfs-v3-kernel-integration:
    name: NFSv3 integration (Linux kernel)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Start Linux kernel NFSv3 server
        run: sudo bash tests/integration/kernel-nfs/setup.sh

      - name: Run NFSv3 integration tests
        env:
          NFSSHARP_RUN_NFSV3_INTEGRATION: "1"
          NFSSHARP_NFS_SERVER: 127.0.0.1
          NFSSHARP_NFS_EXPORT: /srv/nfssharp-kernel-export
          NFSSHARP_NFS_EXPECTED_EXPORT_GROUP: "*"
          NFSSHARP_NFS_EXPECTED_REPLACEMENT_RENAME_OUTCOME: replace-target
          NFSSHARP_NFS_UID: "0"
          NFSSHARP_NFS_GID: "0"
        run: >
          dotnet test tests/NfsSharp.Tests/NfsSharp.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --filter "Category=Integration"
          --logger trx
          --results-directory TestResults/NfsV3KernelIntegration

      - name: Run NFSv3 server-restart recovery test
        env:
          NFSSHARP_RUN_NFSV3_INTEGRATION: "1"
          NFSSHARP_RUN_NFS_SERVER_RESTART_TEST: "1"
          NFSSHARP_NFS_RESTART_KIND: kernel-service
          NFSSHARP_NFS_SERVER: 127.0.0.1
          NFSSHARP_NFS_EXPORT: /srv/nfssharp-kernel-export
          NFSSHARP_NFS_UID: "0"
          NFSSHARP_NFS_GID: "0"
        run: >
          dotnet test tests/NfsSharp.Tests/NfsSharp.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --no-restore
          --filter "Category=IntegrationRestart"
          --logger trx
          --results-directory TestResults/NfsV3KernelIntegration

      - name: Capture Linux kernel NFSv3 evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p TestResults/NfsV3KernelIntegration
          {
            uname -a
            cat /etc/os-release
            dpkg-query --show --showformat='${Package} ${Version}\n' nfs-kernel-server nfs-common rpcbind
          } > TestResults/NfsV3KernelIntegration/server-version.txt 2>&1
          sudo rpcinfo -p 127.0.0.1 > TestResults/NfsV3KernelIntegration/rpcinfo.txt 2>&1
          sudo showmount -e 127.0.0.1 > TestResults/NfsV3KernelIntegration/exports.txt 2>&1
          sudo exportfs -v > TestResults/NfsV3KernelIntegration/exportfs.txt 2>&1
          sudo cat /proc/fs/nfsd/versions > TestResults/NfsV3KernelIntegration/nfs-versions.txt 2>&1
          sudo journalctl --no-pager -u rpcbind.service -u nfs-server.service > TestResults/NfsV3KernelIntegration/nfs-server.log 2>&1

      - name: Upload Linux kernel NFSv3 results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nfs-v3-kernel-integration-results
          path: TestResults/NfsV3KernelIntegration
          if-no-files-found: error

      - name: Stop Linux kernel NFSv3 server
        if: always()
        run: sudo bash tests/integration/kernel-nfs/teardown.sh
